# Tests run inside the project's own CI image (ci/image/), pinned by digest in
# ci/image/image.lock and checked for build provenance before use, so no
# toolchain, browser or third-party action is fetched at run time. Only
# GitHub-owned actions are used, pinned to commit SHAs.

name: Elixir CI

on:
  push:
    branches: [ "main", "current" ]
  pull_request:
    branches: [ "main", "current" ]

permissions:
  contents: read

jobs:
  image:
    name: CI image
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/ci-image-ref.yml

  build:

    name: Test (partition ${{ matrix.partition }}/4)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    env:
      MIX_ENV: test
      PGHOST: postgres

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: baudrate_db_user
          POSTGRES_PASSWORD: baudrate_database
          POSTGRES_DB: baudrate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check the CI image matches the pinned toolchain
      run: ci/image/verify-toolchain.sh
    - name: Restore dependency and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
        key: ${{ runner.os }}-${{ hashFiles('ci/image/image.lock') }}-${{ hashFiles('**/mix.lock', 'native/*/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Compile with warnings-as-errors
      run: mix compile --warnings-as-errors
    - name: Run linter
      run: mix lint
    - name: Run tests
      run: mix test --partitions 4 --seed 9527
      env:
        MIX_TEST_PARTITION: ${{ matrix.partition }}

  feature:

    # Browser (Wallaby + Selenium + headless Firefox ESR) tests. They are
    # excluded from `mix test` and are the only tests that run the JS hooks, so
    # without this job a hook that throws or an unhandled hook event reaches
    # production.
    name: Browser tests (Firefox)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      MIX_ENV: test
      PGHOST: postgres

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: baudrate_db_user
          POSTGRES_PASSWORD: baudrate_database
          POSTGRES_DB: baudrate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check the CI image matches the pinned toolchain
      run: ci/image/verify-toolchain.sh
    - name: Restore dependency and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
        key: ${{ runner.os }}-${{ hashFiles('ci/image/image.lock') }}-${{ hashFiles('**/mix.lock', 'native/*/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    # esbuild and Tailwind come from the image (MIX_ESBUILD_PATH, MIX_TAILWIND_PATH).
    - name: Build assets
      run: mix assets.build
    - name: Run browser tests
      run: mix test --only feature --include feature --seed 9527
      env:
        # The runner mounts HOME (/github/home) owned by another uid, and
        # Firefox refuses to start as root in a home it does not own.
        HOME: /root
    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: wallaby-screenshots
        path: |
          tmp/wallaby_screenshots/
          /opt/selenium/server.log
        if-no-files-found: ignore
