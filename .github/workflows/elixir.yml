# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main", "current" ]
  pull_request:
    branches: [ "main", "current" ]

permissions:
  contents: read

jobs:
  build:

    name: Test (partition ${{ matrix.partition }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: baudrate_db_user
          POSTGRES_PASSWORD: baudrate_database
          POSTGRES_DB: baudrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Set up asdf
      uses: ynab/asdf-action@v1.2
      with:
        version: 0.16.7
    - uses: actions/checkout@v7
    - name: Install Erlang and Elixir
      run: |
        asdf plugin add erlang
        asdf plugin add elixir
        asdf install
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Restore Cargo cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          native/*/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('native/*/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Compile with warnings-as-errors
      run: mix compile --warnings-as-errors
    - name: Run linter
      run: mix lint
    - name: Run tests
      run: mix test --partitions 4 --seed 9527
      env:
        MIX_TEST_PARTITION: ${{ matrix.partition }}

  feature:

    # Browser (Wallaby + Selenium + headless Firefox) tests. They are excluded
    # from `mix test` and are the only tests that run the JS hooks, so without
    # this job a hook that throws or an unhandled hook event reaches production.
    name: Browser tests (Firefox)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: baudrate_db_user
          POSTGRES_PASSWORD: baudrate_database
          POSTGRES_DB: baudrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Set up asdf
      uses: ynab/asdf-action@v1.2
      with:
        version: 0.16.7
    - uses: actions/checkout@v7
    - name: Install Erlang and Elixir
      run: |
        asdf plugin add erlang
        asdf plugin add elixir
        asdf install
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Restore Cargo cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          native/*/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('native/*/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Build assets
      run: |
        mix assets.setup
        mix assets.build
    - name: Restore Selenium cache
      uses: actions/cache@v6
      with:
        path: tmp/selenium
        key: ${{ runner.os }}-selenium-${{ hashFiles('lib/mix/tasks/selenium_setup.ex') }}
    # Downloads are verified against pinned SHA-256 checksums.
    - name: Download Selenium Server and GeckoDriver
      run: mix selenium.setup
    - name: Show browser versions
      run: |
        firefox --version
        java -version
        tmp/selenium/geckodriver --version | head -1
    - name: Run browser tests
      run: mix test --only feature --include feature --seed 9527
    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: wallaby-screenshots
        path: tmp/wallaby_screenshots/
        if-no-files-found: ignore
