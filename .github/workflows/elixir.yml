# Tests run inside the project's own CI image (ci/image/), pinned by digest in
# ci/image/image.lock and checked for build provenance before use, so no
# toolchain, browser or third-party action is fetched at run time. Only
# GitHub-owned actions are used, pinned to commit SHAs.
#
# Besides the tests: the Static checks job runs the gettext extraction check,
# Dialyzer against its reviewed baseline, clippy and the Rust unit tests of
# the three NIF crates, and ansible-lint (Phase 8A); the Coverage job merges
# each partition's coverage into one report, uploaded as an artifact; the
# Security job runs Sobelow and mix_audit, and the
# Release job builds the production release in the build image
# (ci/image/build-image.lock) and smoke-tests it, the way release.yml does
# for a published release, so a change that breaks the release fails here
# rather than after tagging (ADR 0036).

name: Elixir CI

on:
  push:
    # `main` is never pushed to directly — it moves only by `--ff-only` merge
    # from `current` at a release, so a push run there re-tests the SHA that
    # passed minutes earlier. Documentation carries no test (nothing under
    # `test/` reads `doc/**` or the repository README), and `paths-ignore`
    # skips a push only when *every* changed file matches it, so a commit
    # touching docs and code still runs.
    branches: [ "current" ]
    paths-ignore:
      - "doc/**"
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [ "main", "current" ]

permissions:
  contents: read

# Development is a long series of pushes to `current`, and only the tip needs
# to be green: a superseded run is cancelled rather than left to finish. The
# cost is that an intermediate commit may carry no run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: CI image
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/ci-image-ref.yml

  build-image:
    name: Build image
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/ci-image-ref.yml
    with:
      image: build

  build:

    name: Test (partition ${{ matrix.partition }}/4)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    env:
      MIX_ENV: test
      PGHOST: postgres

    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_USER: baudrate_db_user
          POSTGRES_PASSWORD: baudrate_database
          POSTGRES_DB: baudrate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check the CI image matches the pinned toolchain
      run: ci/image/verify-toolchain.sh
    - name: Restore dependency and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
        key: ${{ runner.os }}-${{ hashFiles('ci/image/image.lock') }}-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Compile with warnings-as-errors
      run: mix compile --warnings-as-errors
    - name: Run linter
      run: mix lint
    - name: Run tests
      run: mix test --partitions 4 --seed 9527 --cover --export-coverage "partition-${MIX_TEST_PARTITION}"
      env:
        MIX_TEST_PARTITION: ${{ matrix.partition }}
    - name: Upload this partition's coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: coverage-partition-${{ matrix.partition }}
        path: cover/partition-${{ matrix.partition }}.coverdata
        if-no-files-found: error
        retention-days: 7

  coverage:

    # One report from the four partitions' exports. Report only: no threshold
    # (mix.exs `test_coverage`), because a number to reach rewards tests
    # written for the number.
    name: Coverage
    needs: [image, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      MIX_ENV: test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Restore dependency and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
        key: ${{ runner.os }}-${{ hashFiles('ci/image/image.lock') }}-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Compile
      run: mix compile
    - name: Download the partitions' coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: coverage-partition-*
        path: cover
        merge-multiple: true
    - name: Merge and report
      run: |
        set -o pipefail
        mix test.coverage | tee coverage.txt
        {
          echo '## Test coverage'
          echo
          echo '```'
          tail -n 3 coverage.txt
          echo '```'
          echo
          echo 'The per-module HTML report is the `coverage-report` artifact.'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: coverage-report
        path: cover/*.html
        retention-days: 14

  static:

    # What review would otherwise have to catch (Phase 8A): translations
    # extracted from the code, Dialyzer (CI fails on a warning not in the
    # reviewed .dialyzer_ignore.exs), the NIF crates' clippy and unit tests,
    # and ansible-lint. Dev environment, like the Dialyzer baseline.
    name: Static checks
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      MIX_ENV: dev

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check the CI image matches the pinned toolchain
      run: ci/image/verify-toolchain.sh
    - name: Restore dependency, build and PLT caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
          priv/plts
        key: ${{ runner.os }}-static-${{ hashFiles('ci/image/image.lock') }}-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Translations are extracted
      run: mix gettext.extract --check-up-to-date
    - name: Dialyzer
      run: mix dialyzer --format github
    - name: NIF crates — clippy and unit tests
      run: |
        set -eu
        for crate in native/*/; do
          echo "::group::${crate}"
          (cd "$crate" && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked)
          echo "::endgroup::"
        done
    - name: ansible-lint
      working-directory: ansible
      # host_group_vars only: the SOPS vars plugin would try to decrypt the
      # production secrets, which CI never holds.
      env:
        ANSIBLE_VARS_ENABLED: host_group_vars
      run: ansible-lint playbooks/ roles/

  security:

    # Sobelow (static analysis for Phoenix) and mix_audit (known advisories in
    # mix.lock). Every Sobelow finding fails the job; a reviewed false positive
    # is marked with `# sobelow_skip` above its function (.sobelow-conf).
    name: Security checks
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      MIX_ENV: test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check the CI image matches the pinned toolchain
      run: ci/image/verify-toolchain.sh
    - name: Restore dependency and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
        key: ${{ runner.os }}-${{ hashFiles('ci/image/image.lock') }}-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Sobelow
      run: mix sobelow --config
    # The advisory list is the image's (ci/image/README.md): mix_audit reads it
    # under $HOME and finds no checkout to pull, so nothing is fetched. The
    # list must be unchanged afterwards, or the run used something else.
    - name: mix_audit
      run: |
        set -eu
        list="$MIX_AUDIT_HOME/.local/share/elixir-security-advisories-mirego"
        before="$(find "$list" -type f | sort | xargs sha256sum | sha256sum)"
        echo "Advisories at $(cat /opt/mix-audit/ADVISORIES_COMMIT) ($(cat /opt/mix-audit/ADVISORIES_DATE))"
        HOME="$MIX_AUDIT_HOME" GIT_CEILING_DIRECTORIES=/opt mix deps.audit
        after="$(find "$list" -type f | sort | xargs sha256sum | sha256sum)"
        test ! -e "$list/.git"
        if [ "$before" != "$after" ]; then
          echo "::error::the advisory list changed during mix deps.audit; it must come from the image"
          exit 1
        fi

  release:

    # The production release, built and smoke-tested exactly as release.yml
    # does for a published release, but not attested or published.
    name: Release build
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.build-image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_USER: baudrate_smoke
          POSTGRES_PASSWORD: baudrate_smoke
          POSTGRES_DB: baudrate_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check the build image matches the pinned toolchain
      run: ci/image/verify-toolchain.sh
    - name: Restore dependency and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
        key: ${{ runner.os }}-release-${{ hashFiles('ci/image/build-image.lock') }}-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
    - name: Build the release
      env:
        OUT_DIR: dist
      run: ci/release/build.sh
    - name: Smoke-test the release
      env:
        SMOKE_DATABASE_URL: ecto://baudrate_smoke:baudrate_smoke@postgres/baudrate_smoke
      run: ci/release/smoke-test.sh "dist/$(cat dist/.tarball)"

  feature:

    # Browser (Wallaby + Selenium + headless Firefox ESR) tests. They are
    # excluded from `mix test` and are the only tests that run the JS hooks, so
    # without this job a hook that throws or an unhandled hook event reaches
    # production.
    name: Browser tests (Firefox)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      MIX_ENV: test
      PGHOST: postgres

    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_USER: baudrate_db_user
          POSTGRES_PASSWORD: baudrate_database
          POSTGRES_DB: baudrate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check the CI image matches the pinned toolchain
      run: ci/image/verify-toolchain.sh
    - name: Restore dependency and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          native/*/target
          /opt/cargo/registry
        key: ${{ runner.os }}-${{ hashFiles('ci/image/image.lock') }}-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    # esbuild and Tailwind come from the image (MIX_ESBUILD_PATH, MIX_TAILWIND_PATH).
    - name: Build assets
      run: mix assets.build
    - name: Run browser tests
      run: mix test --only feature --include feature --seed 9527
      env:
        # The runner mounts HOME (/github/home) owned by another uid, and
        # Firefox refuses to start as root in a home it does not own.
        HOME: /root
    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: wallaby-screenshots
        path: |
          tmp/wallaby_screenshots/
          /opt/selenium/server.log
        if-no-files-found: ignore
