# Covers the dependency surface Dependabot cannot read (see the header of
# .github/dependabot.yml): esbuild/Tailwind binary versions, vendored assets,
# .tool-versions, and retired Hex packages. Results are kept in one rolling
# issue, which is closed automatically once everything is current again.
#
# `mix hex.audit` runs inside the project's CI image (ci/image/), so no
# toolchain is installed at run time; the pin checks only need the runner's
# curl, jq and gh.

name: Dependency drift

on:
  schedule:
    - cron: "0 20 * * 0" # Monday 04:00 Asia/Taipei, alongside Dependabot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift
  cancel-in-progress: true

jobs:
  image:
    name: CI image
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/ci-image-ref.yml

  hex-audit:
    name: Audit Hex packages
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      status: ${{ steps.hex.outputs.status }}
      report: ${{ steps.hex.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit Hex packages for retirements
        id: hex
        run: |
          set +e
          mix deps.get > /dev/null
          out=$(mix hex.audit 2>&1)
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Base64 keeps arbitrary output intact through the job output.
          echo "report=$(printf '%s' "$out" | base64 -w0)" >> "$GITHUB_OUTPUT"

  drift:
    name: Check untracked dependency pins
    needs: hex-audit
    # Still report pin drift when the image or the audit failed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Dependency drift report"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check pinned versions against upstream
        id: pins
        run: |
          set +e
          bash .github/scripts/dependency-drift.sh > report.md
          echo "drift=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add the Hex audit
        id: hex
        env:
          HEX_STATUS: ${{ needs.hex-audit.outputs.status }}
          HEX_REPORT: ${{ needs.hex-audit.outputs.report }}
        run: |
          if [ -z "$HEX_STATUS" ]; then
            out="The audit did not run (CI image verification or the audit job failed)."
            status=1
          else
            out=$(printf '%s' "$HEX_REPORT" | base64 -d)
            status=$HEX_STATUS
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### \`mix hex.audit\`"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } | tee -a report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the rolling drift issue
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n1)

          if [ "${{ steps.pins.outputs.drift }}" = "0" ] && [ "${{ steps.hex.outputs.status }}" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "All untracked dependency pins are current and \`mix hex.audit\` is clean."
            fi
            exit 0
          fi

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file report.md --label dependencies \
              || gh issue create --title "$ISSUE_TITLE" --body-file report.md
          fi
