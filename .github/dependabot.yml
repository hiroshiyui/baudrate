# Dependabot configuration for Baudrate.
# Routine dependency auditing across every manifest Dependabot can read:
# Elixir/Hex (mix.exs + mix.lock, including the `heroicons` git dependency),
# the Rust NIF crates (cargo), and GitHub Actions.
#
# NOT covered by Dependabot (no manifest it understands) — these are checked
# weekly by `.github/workflows/dependency-drift.yml` instead:
#   - esbuild / Tailwind CLI binaries: the `mix` ecosystem only bumps the Hex
#     *installer* packages; the binary versions are the `version:` keys in
#     `config/config.exs`.
#   - Vendored assets in `assets/vendor/` (daisyUI, daisyUI theme, topbar,
#     Cropper.js) — plain copied files with no package.json.
#   - Erlang/OTP and Elixir pinned in `.tool-versions`.
#   - Retired Hex packages (`mix hex.audit`) — retirement is not a GitHub
#     security advisory, so Dependabot never alerts on it.
#
# Security is the top priority for this public-facing system, so security
# updates are ungrouped (one PR each, opened as soon as an advisory lands),
# while routine version bumps are grouped weekly to keep PR noise low.
version: 2
updates:
  # ---- Elixir / Hex (esbuild/tailwind *installer* packages only, not the binaries) ----
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    assignees:
      - hiroshiyui
    labels:
      - dependencies
      - elixir
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      hex-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- Rust NIF crates (each is a standalone crate with its own Cargo.lock) ----
  - package-ecosystem: cargo
    directory: "/native/baudrate_sanitizer"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    assignees:
      - hiroshiyui
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/native/baudrate_html_parser"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    assignees:
      - hiroshiyui
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/native/baudrate_feed_parser"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    assignees:
      - hiroshiyui
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- GitHub Actions used by CI workflows ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    assignees:
      - hiroshiyui
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
