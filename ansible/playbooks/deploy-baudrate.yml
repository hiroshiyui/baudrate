---
# Baudrate — Application deployment playbook
#
# Installs the release CI built and attested for a tag (ADR 0036): verifies
# the tarball attached to the GitHub release on this machine, installs it
# into a timestamped release directory, runs migrations, swaps the `current`
# symlink and (re)starts the app via systemd. Nothing is compiled on the
# server. To return to a release already on the server, use
# rollback-baudrate.yml.
#
# Requires setup-server.yml to have been run first (PostgreSQL, nginx, the
# baudrate system user), and on this machine: the GitHub CLI signed in
# (`gh auth login`), and the tag fetched into this clone (`git fetch --tags`).
#
# Secrets are decrypted automatically from all.sops.yml via your GPG key.
#
# Usage:
#   ansible-playbook playbooks/deploy-baudrate.yml
#   ansible-playbook playbooks/deploy-baudrate.yml -e release_tag=v1.0.0
#
- name: Deploy Baudrate
  hosts: production
  become: true

  vars_prompt:
    - name: domain
      prompt: "Site domain name"
      default: "{{ lookup('ansible.builtin.env', 'BAUDRATE_DOMAIN') }}"
      private: false

    - name: release_tag
      prompt: "GitHub release tag to deploy (e.g. v1.0.0)"
      private: false

    - name: release_repo
      prompt: "GitHub repository the release comes from (owner/name)"
      default: "{{ release_repo | default('hiroshiyui/baudrate') }}"
      private: false

  pre_tasks:
    - name: Validate domain is provided
      ansible.builtin.assert:
        that:
          - domain | length > 0
        fail_msg: "domain is required. Set BAUDRATE_DOMAIN or enter it at the prompt."

    - name: Validate release_tag is provided
      ansible.builtin.assert:
        that:
          - release_tag | length > 0
        fail_msg: "release_tag is required. Specify a git tag (e.g. v1.0.0)."

    - name: Validate release_repo
      ansible.builtin.assert:
        that:
          - release_repo is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
        fail_msg: "release_repo must be owner/name, got '{{ release_repo }}'."

    - name: Generate secret key base (not found in all.sops.yml)
      when: secret_key_base is not defined
      block:
        - name: Generate random secret key base
          ansible.builtin.set_fact:
            secret_key_base: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}"

        - name: Display generated secret key base
          ansible.builtin.debug:
            msg: |
              ============================================================
              Generated SECRET_KEY_BASE: {{ secret_key_base }}

              Save this to your SOPS secrets file:

                sops inventory/group_vars/all.sops.yml

              Add the value:
                secret_key_base: "{{ secret_key_base }}"
              ============================================================

        - name: Confirm secret key base has been saved
          ansible.builtin.pause:
            prompt: "Press Enter after you have saved the secret key base (Ctrl+C to abort)"

    - name: Generate installation key (not found in all.sops.yml)
      when: installation_key is not defined
      block:
        - name: Generate random installation key
          ansible.builtin.set_fact:
            installation_key: "{{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits') }}"

        - name: Display generated installation key
          ansible.builtin.debug:
            msg: |
              ============================================================
              Generated INSTALLATION_KEY: {{ installation_key }}

              Use this key to complete the setup wizard at /setup after
              the first deploy. Save it to your SOPS secrets file:

                sops inventory/group_vars/all.sops.yml

              Add the value:
                installation_key: "{{ installation_key }}"

              NOTE: This key is only needed for the initial setup wizard, but
              it is REQUIRED until that wizard completes — without it the app
              answers 503 on every browser route instead of serving an
              unguarded /setup. You can remove it from the env file once
              setup is complete.
              ============================================================

        - name: Confirm installation key has been saved
          ansible.builtin.pause:
            prompt: "Press Enter after you have saved the installation key (Ctrl+C to abort)"

  roles:
    # Before deploy: it creates the directory the pre-migration dump writes to.
    - role: backup
      tags: [backup]
    - role: deploy
      become_user: "{{ baudrate_user }}"
      tags: [deploy]
