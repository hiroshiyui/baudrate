---
# Debian release codenames by major version. Sources are pinned by codename,
# never by the `stable` channel: the release carries an Erlang runtime and Rust
# NIFs built against this system's glibc and OpenSSL, and the deploy refuses
# any host but `debian_version` (ADR 0036 decision 1). A channel pin would move
# the host under the running release at Debian's next transition.
debian_codenames:
  "12": bookworm
  "13": trixie
  "14": forky

# apt hosts other than Debian's own that the pre-flight accepts. A host that
# is not Debian's and not listed here stops the run: a third-party repository
# (a PGDG PostgreSQL, say) has no suite for the new codename and would break
# the upgrade or be left behind. These two come with Vultr's Debian images:
# their Debian mirror, which carries every release and takes the codename
# rewrite like deb.debian.org, and their own repository for the cloud-init
# build they ship, whose suite ("universal") names no release at all.
apt_hosts_allowed:
  - debian.mirror.constant.com
  - apprepo.vultr.com

# Drop the old PostgreSQL cluster and purge its packages once the upgraded
# cluster has been checked. Off by default: the old cluster is the rollback
# until the operator has looked at the site. Re-run with
# `-e drop_old_cluster=true` to remove it.
drop_old_cluster: false

# Rebuild the asdf Erlang after the reboot, against the new glibc and OpenSSL.
# The deploy skips an Erlang that is already installed, so a build from the old
# release would otherwise be reused. "auto" rebuilds on the first run only: a
# resumed run (or a later drop_old_cluster run) keeps the Erlang the first run
# built. "yes" forces it, "no" skips it.
rebuild_erlang: auto

# `-e confirm=yes` skips the interactive confirmation.
confirm: ""

# `-e resume=yes` continues a run that failed after the sources were switched
# and the host already reports the target release (a package's configure
# step failed, say): fix the cause by hand, then re-run. The backup, the
# sources rewrite and the minimal upgrade are skipped; `dpkg --configure -a`,
# the full upgrade, the reboot and everything after run again, each step
# idempotent. A PostgreSQL cluster already on the new major is left alone.
resume: ""
