---
- name: Check if rustup is installed
  become_user: "{{ baudrate_user }}"
  ansible.builtin.stat:
    path: "{{ baudrate_home }}/.cargo/bin/rustup"
  register: rustup_installed

# rustup-init is downloaded pinned and checked, never piped from a URL into a
# shell (the CI image installs it the same way).
- name: Download rustup-init
  when: not rustup_installed.stat.exists
  become_user: "{{ baudrate_user }}"
  ansible.builtin.get_url:
    url: "https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/x86_64-unknown-linux-gnu/rustup-init"
    checksum: "sha256:{{ rustup_init_sha256 }}"
    dest: "{{ baudrate_home }}/rustup-init"
    mode: "0755"

- name: Install rustup
  when: not rustup_installed.stat.exists
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/rustup-init -y --profile minimal"
    creates: "{{ baudrate_home }}/.cargo/bin/rustup"
  environment:
    CARGO_HOME: "{{ baudrate_home }}/.cargo"
    RUSTUP_HOME: "{{ baudrate_home }}/.rustup"

- name: Remove rustup-init
  become_user: "{{ baudrate_user }}"
  ansible.builtin.file:
    path: "{{ baudrate_home }}/rustup-init"
    state: absent

- name: Update Rust toolchain
  when: rustup_installed.stat.exists
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.cargo/bin/rustup update"
  environment:
    CARGO_HOME: "{{ baudrate_home }}/.cargo"
    RUSTUP_HOME: "{{ baudrate_home }}/.rustup"
  register: rustup_update
  changed_when: "'updated' in rustup_update.stdout"
