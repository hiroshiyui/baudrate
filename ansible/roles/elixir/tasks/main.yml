---
- name: Install asdf build dependencies
  ansible.builtin.apt:
    name:
      - curl
      - git
      - autoconf
      - libncurses-dev
      - libssl-dev
      - libwxgtk3.2-dev
      - unixodbc-dev
    state: present

- name: Create asdf bin directory
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.file:
    path: "{{ baudrate_home }}/.asdf/bin"
    state: directory
    mode: "0755"

- name: Download asdf binary
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.get_url:
    url: "https://github.com/asdf-vm/asdf/releases/download/v{{ asdf_version }}/asdf-v{{ asdf_version }}-linux-amd64.tar.gz"
    dest: "/tmp/asdf-v{{ asdf_version }}.tar.gz"
    mode: "0644"

- name: Extract asdf binary
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.unarchive:
    src: "/tmp/asdf-v{{ asdf_version }}.tar.gz"
    dest: "{{ baudrate_home }}/.asdf/bin"
    remote_src: true

- name: Verify asdf version
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf version"
    chdir: "{{ baudrate_home }}"
  register: asdf_version_check
  changed_when: false

- name: Remove legacy asdf shell init (pre-0.16)
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.lineinfile:
    path: "{{ baudrate_home }}/.bashrc"
    line: '. "$HOME/.asdf/asdf.sh"'
    state: absent

- name: Add asdf to shell profile
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.blockinfile:
    path: "{{ baudrate_home }}/.bashrc"
    marker: "# {mark} ASDF MANAGED BLOCK"
    block: |
      export ASDF_DATA_DIR="{{ baudrate_home }}/.asdf"
      export PATH="{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:$PATH"
    create: true
    mode: "0644"

# chdir on every asdf command: a become_user command otherwise runs from
# Ansible's temp directory under root's home, which the service user cannot
# read, and asdf (a Go binary) exits 1 without a word when it cannot stat its
# working directory.
- name: Install asdf erlang plugin
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf plugin add erlang"
    chdir: "{{ baudrate_home }}"
    creates: "{{ baudrate_home }}/.asdf/plugins/erlang"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"

- name: Install asdf elixir plugin
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf plugin add elixir"
    chdir: "{{ baudrate_home }}"
    creates: "{{ baudrate_home }}/.asdf/plugins/elixir"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"

# After a Debian release upgrade the installed Erlang is linked against the old
# system's glibc and OpenSSL, and the deploy's NIFs and BEAM files belong to
# it. upgrade-debian.yml does this on its first run; `-e rebuild_erlang=yes`
# does the same here on demand: every Erlang build, kerl's cache and
# registries (kerl refuses to install at a path its registry still lists) and
# the previous build artifacts go, so the install below runs again on the
# current system. The running release keeps its own copy of the runtime and
# is unaffected until the next deploy replaces it. Elixir is bytecode and
# needs no rebuild.
- name: Find the Erlang builds to rebuild
  ansible.builtin.find:
    paths: "{{ baudrate_home }}/.asdf/installs/erlang"
    file_type: directory
    recurse: false
  register: erlang_builds
  when: rebuild_erlang | default('') == 'yes'

- name: Remove the Erlang builds from the previous system
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ erlang_builds.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: rebuild_erlang | default('') == 'yes'

- name: Remove kerl's cache and registries along with the builds
  ansible.builtin.file:
    path: "{{ baudrate_home }}/.asdf/plugins/erlang/kerl-home"
    state: absent
  when: rebuild_erlang | default('') == 'yes'

- name: Remove build artifacts made with the previous Erlang
  ansible.builtin.file:
    path: "{{ deploy_path }}/src/_build/prod"
    state: absent
  when: rebuild_erlang | default('') == 'yes'

- name: Install Erlang {{ erlang_version }}
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf install erlang {{ erlang_version }}"
    chdir: "{{ baudrate_home }}"
    creates: "{{ baudrate_home }}/.asdf/installs/erlang/{{ erlang_version }}"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"

- name: Set the global default Erlang to {{ erlang_version }}
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf set --home erlang {{ erlang_version }}"
    chdir: "{{ baudrate_home }}"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
  changed_when: true

- name: Install Elixir {{ elixir_version }}
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf install elixir {{ elixir_version }}"
    chdir: "{{ baudrate_home }}"
    creates: "{{ baudrate_home }}/.asdf/installs/elixir/{{ elixir_version }}"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"

- name: Set the global default Elixir to {{ elixir_version }}
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf set --home elixir {{ elixir_version }}"
    chdir: "{{ baudrate_home }}"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
  changed_when: true

- name: Install Hex
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf exec mix local.hex --force"
    chdir: "{{ baudrate_home }}"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"
  changed_when: false

- name: Install Rebar
  become: true
  become_user: "{{ baudrate_user }}"
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf exec mix local.rebar --force"
    chdir: "{{ baudrate_home }}"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"
  changed_when: false
