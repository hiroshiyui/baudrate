---
# Baudrate — Deploy role
#
# Builds Baudrate from a git release tag on the server, creates an OTP release,
# manages symlink-based releases, runs migrations, and restarts the service.
#
# Releases are also built, smoke-tested and attested in CI (ADR 0036) and
# attached to each GitHub release, but the deploy builds here: moving a 46 MB
# tarball down from GitHub and up to the server cost more on the operator's
# link than an incremental build costs the server (ADR 0037). The attached
# tarball remains for installing by hand.

# ============================================================
# Phase 1: Pre-flight checks
# ============================================================

- name: Validate the release tag
  ansible.builtin.assert:
    that:
      - release_tag is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "release_tag must look like v1.2.3, got '{{ release_tag }}'."

- name: Verify baudrate user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ baudrate_user }}"
  register: baudrate_user_check

- name: Verify asdf is installed
  ansible.builtin.stat:
    path: "{{ baudrate_home }}/.asdf/bin/asdf"
  register: asdf_check

- name: Fail if asdf is not installed
  ansible.builtin.assert:
    that:
      - asdf_check.stat.exists
    fail_msg: >
      asdf is not installed for {{ baudrate_user }}.
      Run setup-server.yml first to provision the server.

- name: Check for currently deployed release
  ansible.builtin.stat:
    path: "{{ deploy_path }}/current"
  register: current_release

- name: Read current release tag
  when: current_release.stat.exists
  block:
    - name: Check for deployed tag file
      ansible.builtin.stat:
        path: "{{ deploy_path }}/current/.release_tag"
      register: tag_file

    - name: Read deployed tag
      when: tag_file.stat.exists
      ansible.builtin.slurp:
        src: "{{ deploy_path }}/current/.release_tag"
      register: deployed_tag_raw

    - name: Set deployed tag fact
      when: tag_file.stat.exists
      ansible.builtin.set_fact:
        deployed_tag: "{{ deployed_tag_raw.content | b64decode | trim }}"

    - name: Warn if deploying older version
      when:
        - deployed_tag is defined
        - (release_tag | regex_replace('^v', '')) is version((deployed_tag | regex_replace('^v', '')), '<')
      block:
        - name: Display version warning
          ansible.builtin.debug:
            msg: |
              ============================================================
              WARNING: You are deploying {{ release_tag }} which is OLDER
              than the currently deployed {{ deployed_tag }}.

              To return to a release still on the server, use
              playbooks/rollback-baudrate.yml instead: it checks the
              database schema first, and builds nothing.
              ============================================================

        - name: Confirm rollback
          ansible.builtin.pause:
            prompt: "Press Enter to continue with rollback, or Ctrl+C to abort"

# ============================================================
# Phase 2: Create directory structure
# ============================================================

- name: Create deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_path }}/releases"
    - "{{ deploy_path }}/shared/uploads/avatars"
    - "{{ deploy_path }}/shared/uploads/article_images"
    - "{{ deploy_path }}/shared/uploads/link_preview_images"
    # Cached copies of remote images, served only through the signed
    # /media/ route (nginx denies this path directly).
    - "{{ deploy_path }}/shared/uploads/media_cache"
    - "{{ deploy_path }}/env"

- name: Restrict env directory permissions
  ansible.builtin.file:
    path: "{{ deploy_path }}/env"
    mode: "0700"

# ============================================================
# Phase 3: Source checkout
# ============================================================

- name: Set release timestamp
  ansible.builtin.set_fact:
    release_timestamp: "{{ ansible_facts.date_time.date | replace('-', '') }}_{{ ansible_facts.date_time.time | replace(':', '') }}"

- name: Clone or update source repository
  ansible.builtin.git:
    repo: "{{ git_repo }}"
    dest: "{{ deploy_path }}/src"
    version: "{{ release_tag }}"
    force: true

# ============================================================
# Phase 4: Build OTP release
# ============================================================

# Compiled BEAM files and Rust NIFs in _build/prod belong to the Erlang/Elixir
# toolchain that built them. A stamp copy of .tool-versions is written after
# each successful compile; when the checked-out tag pins a different toolchain
# (or no stamp exists yet), _build/prod is wiped so nothing built by the old
# toolchain is reused in the release.
- name: Read toolchain pins of the checked-out tag
  ansible.builtin.slurp:
    src: "{{ deploy_path }}/src/.tool-versions"
  register: tool_versions_current

- name: Check toolchain stamp of the previous build
  ansible.builtin.stat:
    path: "{{ deploy_path }}/src/_build/prod/.tool-versions.stamp"
    get_checksum: true
    checksum_algorithm: sha256
  register: tool_versions_stamp

- name: Remove build artifacts from a different Erlang/Elixir toolchain
  ansible.builtin.file:
    path: "{{ deploy_path }}/src/_build/prod"
    state: absent
  when: >-
    not tool_versions_stamp.stat.exists
    or tool_versions_stamp.stat.checksum != (tool_versions_current.content | b64decode | hash('sha256'))

- name: Install mix dependencies (prod only)
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf exec mix deps.get --only prod"
    chdir: "{{ deploy_path }}/src"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"
    CARGO_HOME: "{{ baudrate_home }}/.cargo"
    RUSTUP_HOME: "{{ baudrate_home }}/.rustup"
    MIX_ENV: prod
  changed_when: true

- name: Compile application
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf exec mix compile"
    chdir: "{{ deploy_path }}/src"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ baudrate_home }}/.cargo/bin:{{ ansible_facts.env.PATH }}"
    CARGO_HOME: "{{ baudrate_home }}/.cargo"
    RUSTUP_HOME: "{{ baudrate_home }}/.rustup"
    MIX_ENV: prod
  changed_when: true

- name: Record toolchain stamp for this build
  ansible.builtin.copy:
    src: "{{ deploy_path }}/src/.tool-versions"
    dest: "{{ deploy_path }}/src/_build/prod/.tool-versions.stamp"
    remote_src: true
    mode: "0644"

- name: Deploy assets
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf exec mix assets.deploy"
    chdir: "{{ deploy_path }}/src"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"
    MIX_ENV: prod
  changed_when: true

- name: Remove stale release directory from previous builds
  ansible.builtin.file:
    path: "{{ deploy_path }}/src/_build/prod/rel"
    state: absent

- name: Build OTP release
  ansible.builtin.command:
    cmd: "{{ baudrate_home }}/.asdf/bin/asdf exec mix release --overwrite"
    chdir: "{{ deploy_path }}/src"
  environment:
    ASDF_DATA_DIR: "{{ baudrate_home }}/.asdf"
    PATH: "{{ baudrate_home }}/.asdf/bin:{{ baudrate_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"
    MIX_ENV: prod
  changed_when: true

# ============================================================
# Phase 5: Install release
# ============================================================

- name: Copy release to timestamped directory
  ansible.builtin.copy:
    src: "{{ deploy_path }}/src/_build/prod/rel/baudrate/"
    dest: "{{ deploy_path }}/releases/{{ release_timestamp }}"
    remote_src: true
    mode: preserve

- name: Write release tag file
  ansible.builtin.copy:
    content: "{{ release_tag }}"
    dest: "{{ deploy_path }}/releases/{{ release_timestamp }}/.release_tag"
    mode: "0644"

- name: Find uploads directory in release
  ansible.builtin.find:
    paths: "{{ deploy_path }}/releases/{{ release_timestamp }}"
    patterns: "uploads"
    file_type: directory
    recurse: true
  register: release_uploads_dirs

- name: Remove uploads directory from release
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ release_uploads_dirs.files }}"
  when: release_uploads_dirs.matched > 0

- name: Find priv/static directory in release
  ansible.builtin.find:
    paths: "{{ deploy_path }}/releases/{{ release_timestamp }}/lib"
    patterns: "static"
    file_type: directory
    recurse: true
  register: release_static_dirs

- name: Symlink shared uploads into release static directory
  ansible.builtin.file:
    src: "{{ deploy_path }}/shared/uploads"
    dest: "{{ item.path }}/uploads"
    state: link
  loop: "{{ release_static_dirs.files }}"
  when:
    - release_static_dirs.matched > 0
    - "'/priv/static' in item.path"

# ============================================================
# Phase 6: Environment file
# ============================================================

# The release's own releases/COOKIE is the public placeholder every build
# carries, and the release refuses to join the Erlang distribution with it
# (rel/env.sh.eex). Each server gets a cookie generated on it, once, readable
# only by the service user.
- name: Generate this server's Erlang distribution cookie (once)
  ansible.builtin.shell:
    cmd: umask 077 && head -c 48 /dev/urandom | base64 | tr -d '/+=\n' > release_cookie
    chdir: "{{ deploy_path }}/env"
    creates: "{{ deploy_path }}/env/release_cookie"

- name: Read the Erlang distribution cookie
  ansible.builtin.slurp:
    src: "{{ deploy_path }}/env/release_cookie"
  register: release_cookie_file
  no_log: true

- name: Check the Erlang distribution cookie
  ansible.builtin.set_fact:
    release_cookie: "{{ release_cookie_file.content | b64decode | trim }}"
  failed_when: (release_cookie_file.content | b64decode | trim | length) < 32
  no_log: true

- name: Deploy environment file
  ansible.builtin.template:
    src: baudrate.env.j2
    dest: "{{ deploy_path }}/env/baudrate.env"
    mode: "0600"
  no_log: true
  notify: Restart baudrate

# ============================================================
# Phase 7: Systemd service
# ============================================================

- name: Deploy systemd service unit
  become_user: root
  ansible.builtin.template:
    src: baudrate.service.j2
    dest: /etc/systemd/system/baudrate.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart baudrate

- name: Enable baudrate service
  become_user: root
  ansible.builtin.systemd:
    name: baudrate
    enabled: true

# ============================================================
# Phase 8: Database migration (BEFORE symlink swap)
# ============================================================
# Migrations run from the new release directory (not "current")
# so the DB is ready before the app restarts. Ecto migrations
# are forward-compatible — the old running code can tolerate
# new columns/tables (additive migrations). This minimises the
# restart window: only the symlink swap + service restart
# remain, which nginx buffers via proxy_next_upstream.

# Taken with the new release, right before its migrations, so a migration that
# goes wrong can be undone to minutes earlier rather than to the last nightly
# backup (ADR 0028). The dump keeps the newest few and refuses to fill the
# disk; any failure stops the deploy before the database changes. A release
# older than the pre-deploy dump (a rollback) skips it with a message.

- name: Dump the database before migrations
  ansible.builtin.shell:
    # umask, so a release older than the dump's own chmod still writes a dump
    # no other local user can read.
    cmd: >-
      umask 0027 &&
      {{ deploy_path }}/releases/{{ release_timestamp }}/bin/baudrate eval
      'if Code.ensure_loaded?(Baudrate.Release) and
      function_exported?(Baudrate.Release, :predeploy_dump, 2),
      do: Baudrate.Release.predeploy_dump("{{ backup_path }}/predeploy",
      keep: {{ backup_keep_predeploy }}, label: "{{ release_tag }}"),
      else: IO.puts("skipped: this release has no pre-deploy dump")'
  environment:
    DATABASE_URL: "ecto://{{ postgres_db_user }}:{{ postgres_db_password }}@localhost/{{ postgres_db_name }}"
    DATABASE_SSL: "false"
    SECRET_KEY_BASE: "{{ secret_key_base }}"
    PHX_HOST: "{{ domain }}"
  register: predeploy_dump
  changed_when: "'database dump:' in predeploy_dump.stdout"

- name: Run database migrations
  ansible.builtin.command:
    cmd: "{{ deploy_path }}/releases/{{ release_timestamp }}/bin/migrate"
  environment:
    DATABASE_URL: "ecto://{{ postgres_db_user }}:{{ postgres_db_password }}@localhost/{{ postgres_db_name }}"
    DATABASE_SSL: "false"
    SECRET_KEY_BASE: "{{ secret_key_base }}"
    PHX_HOST: "{{ domain }}"
    PHX_SERVER: "true"
  no_log: true
  register: migration_result
  changed_when: "'already up' not in migration_result.stdout"

# ============================================================
# Phase 9: Activate release (atomic symlink swap)
# ============================================================

- name: Activate release — update current symlink
  ansible.builtin.file:
    src: "{{ deploy_path }}/releases/{{ release_timestamp }}"
    dest: "{{ deploy_path }}/current"
    state: link
    force: true
  notify: Restart baudrate

- name: Find priv/static path in active release
  ansible.builtin.shell:
    cmd: "readlink -f {{ deploy_path }}/releases/{{ release_timestamp }}/lib/baudrate-*/priv/static | tail -1"
  register: static_path_result
  changed_when: false

- name: Update static symlink
  ansible.builtin.file:
    src: "{{ static_path_result.stdout | trim }}"
    dest: "{{ deploy_path }}/static"
    state: link
    force: true

# ============================================================
# Phase 10: Restart and health check
# ============================================================

- name: Flush handlers to restart service
  ansible.builtin.meta: flush_handlers

- name: Wait for application to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 30
  delay: 2

# ============================================================
# Phase 11: Cleanup old releases
# ============================================================

- name: List all releases
  ansible.builtin.find:
    paths: "{{ deploy_path }}/releases"
    file_type: directory
    recurse: false
  register: all_releases

- name: Remove old releases (keep {{ keep_releases }} most recent)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (all_releases.files | sort(attribute='path') | reverse | list)[keep_releases:] }}"
  when: all_releases.files | length > keep_releases
