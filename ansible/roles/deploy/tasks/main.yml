---
# Baudrate — Deploy role
#
# Installs the release CI built for a tag (ADR 0036): downloads the tarball
# attached to the GitHub release, verifies on the controller that
# .github/workflows/release.yml built it from the tag's commit, installs it
# into a timestamped release directory, runs migrations, swaps the `current`
# symlink and restarts the service. Nothing is compiled on the server.

# ============================================================
# Phase 1: Pre-flight checks
# ============================================================

- name: Verify baudrate user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ baudrate_user }}"
  register: baudrate_user_check

- name: Validate the release tag
  ansible.builtin.assert:
    that:
      - release_tag is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "release_tag must look like v1.2.3, got '{{ release_tag }}'."

# A release carries its own Erlang runtime and NIFs, built for production's
# Debian release on x86_64 (ci/image/Dockerfile); it does not start elsewhere.
- name: Check the host runs what releases are built for
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == (debian_version | string)
      - ansible_facts.architecture == 'x86_64'
    fail_msg: >-
      Releases are built for Debian {{ debian_version }} on x86_64, and this host
      runs {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}
      on {{ ansible_facts.architecture }}. Change debian_version and the CI
      image together (ci/image/README.md) before deploying here.

- name: Set release facts
  ansible.builtin.set_fact:
    release_version: "{{ release_tag | regex_replace('^v', '') }}"
    release_artifact: "baudrate-{{ release_tag | regex_replace('^v', '') }}-debian{{ debian_version }}-x86_64.tar.gz"

- name: Check for currently deployed release
  ansible.builtin.stat:
    path: "{{ deploy_path }}/current"
  register: current_release

- name: Read current release tag
  when: current_release.stat.exists
  block:
    - name: Check for deployed tag file
      ansible.builtin.stat:
        path: "{{ deploy_path }}/current/.release_tag"
      register: tag_file

    - name: Read deployed tag
      when: tag_file.stat.exists
      ansible.builtin.slurp:
        src: "{{ deploy_path }}/current/.release_tag"
      register: deployed_tag_raw

    - name: Set deployed tag fact
      when: tag_file.stat.exists
      ansible.builtin.set_fact:
        deployed_tag: "{{ deployed_tag_raw.content | b64decode | trim }}"

    - name: Warn if deploying older version
      when:
        - deployed_tag is defined
        - (release_tag | regex_replace('^v', '')) is version((deployed_tag | regex_replace('^v', '')), '<')
      block:
        - name: Display version warning
          ansible.builtin.debug:
            msg: |
              ============================================================
              WARNING: You are deploying {{ release_tag }} which is OLDER
              than the currently deployed {{ deployed_tag }}.

              To return to a release still on the server, use
              playbooks/rollback-baudrate.yml instead: it checks the
              database schema first.
              ============================================================

        - name: Confirm rollback
          ansible.builtin.pause:
            prompt: "Press Enter to continue with rollback, or Ctrl+C to abort"

# ============================================================
# Phase 2: Fetch and verify the release (on the controller)
# ============================================================
# The attestation is checked here, before anything reaches the server: the
# tarball must have been signed by this repository's release workflow, on a
# GitHub-hosted runner, for this tag, at the commit the tag names in the
# controller's own clone. A tag moved on GitHub after you fetched it therefore
# fails, as does a tarball built by any other workflow or from any other
# commit. The server receives only the verified file, and checks its digest.

- name: Fetch and verify the release on the controller
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Check the GitHub CLI can authenticate
      ansible.builtin.command:
        cmd: gh auth status --hostname github.com
      changed_when: false
      register: gh_auth
      failed_when: gh_auth.rc != 0

    - name: Resolve the tag in the local clone
      ansible.builtin.command:
        cmd: git -C "{{ playbook_dir }}/../.." rev-parse --verify --quiet "refs/tags/{{ release_tag }}^{commit}"
      changed_when: false
      register: release_commit
      failed_when: release_commit.rc != 0 or (release_commit.stdout | trim | length) != 40

    - name: Create a temporary directory for the release
      ansible.builtin.tempfile:
        state: directory
        prefix: baudrate-deploy-
      register: release_download

    - name: Download the release tarball
      ansible.builtin.command:
        argv:
          - gh
          - release
          - download
          - "{{ release_tag }}"
          - --repo
          - "{{ release_repo }}"
          - --pattern
          - "{{ release_artifact }}"
          - --dir
          - "{{ release_download.path }}"
      changed_when: true

    - name: Verify the release was built by the release workflow from the tag
      ansible.builtin.command:
        argv:
          - gh
          - attestation
          - verify
          - "{{ release_download.path }}/{{ release_artifact }}"
          - --repo
          - "{{ release_repo }}"
          - --signer-workflow
          - "{{ release_repo }}/.github/workflows/release.yml"
          - --source-ref
          - "refs/tags/{{ release_tag }}"
          - --source-digest
          - "{{ release_commit.stdout | trim }}"
          - --deny-self-hosted-runners
      changed_when: false

    - name: Record the verified digest
      ansible.builtin.stat:
        path: "{{ release_download.path }}/{{ release_artifact }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: release_verified

  rescue:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ release_download.path }}"
        state: absent
      when: release_download.path is defined

    - name: Stop the deploy
      ansible.builtin.fail:
        msg: >-
          Could not fetch or verify {{ release_artifact }} for {{ release_tag }}.
          Check that `gh auth status` succeeds, that the tag is in this clone
          (`git fetch --tags`) at the commit GitHub has, and that the Release
          workflow finished attaching the tarball to the GitHub release.

# ============================================================
# Phase 3: Create directory structure
# ============================================================

- name: Create deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_path }}/releases"
    - "{{ deploy_path }}/shared/uploads/avatars"
    - "{{ deploy_path }}/shared/uploads/article_images"
    - "{{ deploy_path }}/shared/uploads/link_preview_images"
    # Cached copies of remote images, served only through the signed
    # /media/ route (nginx denies this path directly).
    - "{{ deploy_path }}/shared/uploads/media_cache"
    - "{{ deploy_path }}/env"

- name: Restrict env directory permissions
  ansible.builtin.file:
    path: "{{ deploy_path }}/env"
    mode: "0700"

# ============================================================
# Phase 4: Install release
# ============================================================

- name: Set release timestamp
  ansible.builtin.set_fact:
    release_timestamp: "{{ ansible_facts.date_time.date | replace('-', '') }}_{{ ansible_facts.date_time.time | replace(':', '') }}"

- name: Install the verified release
  block:
    - name: Copy the verified tarball to the server
      ansible.builtin.copy:
        src: "{{ release_download.path }}/{{ release_artifact }}"
        dest: "{{ deploy_path }}/releases/{{ release_timestamp }}.tar.gz"
        mode: "0600"

    - name: Check the tarball arrived intact
      ansible.builtin.stat:
        path: "{{ deploy_path }}/releases/{{ release_timestamp }}.tar.gz"
        get_checksum: true
        checksum_algorithm: sha256
      register: release_copied
      failed_when: release_copied.stat.checksum != release_verified.stat.checksum

    - name: Create the release directory
      ansible.builtin.file:
        path: "{{ deploy_path }}/releases/{{ release_timestamp }}"
        state: directory
        mode: "0755"

    - name: Unpack the release
      ansible.builtin.unarchive:
        src: "{{ deploy_path }}/releases/{{ release_timestamp }}.tar.gz"
        dest: "{{ deploy_path }}/releases/{{ release_timestamp }}"
        remote_src: true
        extra_opts: [--no-same-owner]

  always:
    - name: Remove the tarball from the server
      ansible.builtin.file:
        path: "{{ deploy_path }}/releases/{{ release_timestamp }}.tar.gz"
        state: absent

    - name: Remove the temporary directory on the controller
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.file:
        path: "{{ release_download.path }}"
        state: absent

- name: Check the release is the version the tag names
  ansible.builtin.stat:
    path: "{{ deploy_path }}/releases/{{ release_timestamp }}/releases/{{ release_version }}/start.boot"
  register: release_boot
  failed_when: not release_boot.stat.exists

- name: Write release tag file
  ansible.builtin.copy:
    content: "{{ release_tag }}"
    dest: "{{ deploy_path }}/releases/{{ release_timestamp }}/.release_tag"
    mode: "0644"

- name: Find uploads directory in release
  ansible.builtin.find:
    paths: "{{ deploy_path }}/releases/{{ release_timestamp }}"
    patterns: "uploads"
    file_type: directory
    recurse: true
  register: release_uploads_dirs

- name: Remove uploads directory from release
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ release_uploads_dirs.files }}"
  when: release_uploads_dirs.matched > 0

- name: Find priv/static directory in release
  ansible.builtin.find:
    paths: "{{ deploy_path }}/releases/{{ release_timestamp }}/lib"
    patterns: "static"
    file_type: directory
    recurse: true
  register: release_static_dirs

- name: Symlink shared uploads into release static directory
  ansible.builtin.file:
    src: "{{ deploy_path }}/shared/uploads"
    dest: "{{ item.path }}/uploads"
    state: link
  loop: "{{ release_static_dirs.files }}"
  when:
    - release_static_dirs.matched > 0
    - "'/priv/static' in item.path"

# ============================================================
# Phase 5: Environment file
# ============================================================

# The release's own releases/COOKIE is published with it, so the release
# refuses to join the Erlang distribution with it (rel/env.sh.eex). Each
# server gets a cookie generated on it, once, readable only by the service
# user; it is never sent to the controller's disk or to GitHub.
- name: Generate this server's Erlang distribution cookie (once)
  ansible.builtin.shell:
    cmd: umask 077 && head -c 48 /dev/urandom | base64 | tr -d '/+=\n' > release_cookie
    chdir: "{{ deploy_path }}/env"
    creates: "{{ deploy_path }}/env/release_cookie"

- name: Read the Erlang distribution cookie
  ansible.builtin.slurp:
    src: "{{ deploy_path }}/env/release_cookie"
  register: release_cookie_file
  no_log: true

- name: Check the Erlang distribution cookie
  ansible.builtin.set_fact:
    release_cookie: "{{ release_cookie_file.content | b64decode | trim }}"
  failed_when: (release_cookie_file.content | b64decode | trim | length) < 32
  no_log: true

- name: Deploy environment file
  ansible.builtin.template:
    src: baudrate.env.j2
    dest: "{{ deploy_path }}/env/baudrate.env"
    mode: "0600"
  no_log: true
  notify: Restart baudrate

# ============================================================
# Phase 6: Systemd service
# ============================================================

- name: Deploy systemd service unit
  become_user: root
  ansible.builtin.template:
    src: baudrate.service.j2
    dest: /etc/systemd/system/baudrate.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart baudrate

- name: Enable baudrate service
  become_user: root
  ansible.builtin.systemd:
    name: baudrate
    enabled: true

# ============================================================
# Phase 7: Database migration (BEFORE symlink swap)
# ============================================================
# Migrations run from the new release directory (not "current")
# so the DB is ready before the app restarts. Ecto migrations
# are forward-compatible — the old running code can tolerate
# new columns/tables (additive migrations). This minimises the
# restart window: only the symlink swap + service restart
# remain, which nginx buffers via proxy_next_upstream.

# Taken with the new release, right before its migrations, so a migration that
# goes wrong can be undone to minutes earlier rather than to the last nightly
# backup (ADR 0028). The dump keeps the newest few and refuses to fill the
# disk; any failure stops the deploy before the database changes. A release
# older than the pre-deploy dump (a rollback) skips it with a message.

- name: Dump the database before migrations
  ansible.builtin.shell:
    # umask, so a release older than the dump's own chmod still writes a dump
    # no other local user can read.
    cmd: >-
      umask 0027 &&
      {{ deploy_path }}/releases/{{ release_timestamp }}/bin/baudrate eval
      'if Code.ensure_loaded?(Baudrate.Release) and
      function_exported?(Baudrate.Release, :predeploy_dump, 2),
      do: Baudrate.Release.predeploy_dump("{{ backup_path }}/predeploy",
      keep: {{ backup_keep_predeploy }}, label: "{{ release_tag }}"),
      else: IO.puts("skipped: this release has no pre-deploy dump")'
  environment:
    DATABASE_URL: "ecto://{{ postgres_db_user }}:{{ postgres_db_password }}@localhost/{{ postgres_db_name }}"
    DATABASE_SSL: "false"
    SECRET_KEY_BASE: "{{ secret_key_base }}"
    PHX_HOST: "{{ domain }}"
  register: predeploy_dump
  changed_when: "'database dump:' in predeploy_dump.stdout"

- name: Run database migrations
  ansible.builtin.command:
    cmd: "{{ deploy_path }}/releases/{{ release_timestamp }}/bin/migrate"
  environment:
    DATABASE_URL: "ecto://{{ postgres_db_user }}:{{ postgres_db_password }}@localhost/{{ postgres_db_name }}"
    DATABASE_SSL: "false"
    SECRET_KEY_BASE: "{{ secret_key_base }}"
    PHX_HOST: "{{ domain }}"
    PHX_SERVER: "true"
  no_log: true
  register: migration_result
  changed_when: "'already up' not in migration_result.stdout"

# ============================================================
# Phase 8: Activate release (atomic symlink swap)
# ============================================================

- name: Activate release — update current symlink
  ansible.builtin.file:
    src: "{{ deploy_path }}/releases/{{ release_timestamp }}"
    dest: "{{ deploy_path }}/current"
    state: link
    force: true
  notify: Restart baudrate

- name: Find priv/static path in active release
  ansible.builtin.shell:
    cmd: "readlink -f {{ deploy_path }}/releases/{{ release_timestamp }}/lib/baudrate-*/priv/static | tail -1"
  register: static_path_result
  changed_when: false

- name: Update static symlink
  ansible.builtin.file:
    src: "{{ static_path_result.stdout | trim }}"
    dest: "{{ deploy_path }}/static"
    state: link
    force: true

# ============================================================
# Phase 9: Restart and health check
# ============================================================

- name: Flush handlers to restart service
  ansible.builtin.meta: flush_handlers

- name: Wait for application to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 30
  delay: 2

# ============================================================
# Phase 10: Cleanup old releases
# ============================================================

- name: List all releases
  ansible.builtin.find:
    paths: "{{ deploy_path }}/releases"
    file_type: directory
    recurse: false
  register: all_releases

- name: Remove old releases (keep {{ keep_releases }} most recent)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (all_releases.files | sort(attribute='path') | reverse | list)[keep_releases:] }}"
  when: all_releases.files | length > keep_releases
